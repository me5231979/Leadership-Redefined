name: Fetch assets
# Downloads the files listed in .github/fetch-assets.json into the site,
# evens out audio loudness when an entry asks for it, commits them, and
# publishes the live site. Runs when that list changes, or by hand.
on:
  push:
    branches: ['claude/eloquent-mendel-0qq5xp', 'main']
    paths: ['.github/fetch-assets.json', '.github/workflows/fetch-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          cfg = json.load(open('.github/fetch-assets.json'))
          for f in cfg['files']:
              dest = f['dest']; os.makedirs(os.path.dirname(dest), exist_ok=True)
              raw = dest + '.download'
              urllib.request.urlretrieve(f['url'], raw)
              if f.get('loudness') is not None:
                  subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-i', raw, '-af', 'loudnorm=I=%s:TP=-1.5:LRA=11' % f['loudness'], '-ar', '44100', '-b:a', '160k', dest], check=True)
                  os.remove(raw)
              else:
                  os.replace(raw, dest)
              print('fetched', dest, os.path.getsize(dest))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $(python3 -c "import json;print(' '.join(f['dest'] for f in json.load(open('.github/fetch-assets.json'))['files']))")
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Fetch assets"; git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"; git push origin HEAD:"${GITHUB_REF_NAME}"; fi
      - name: Publish to the live site
        run: |
          git fetch -q origin gh-pages || true
          if git merge-base --is-ancestor origin/gh-pages HEAD; then git push origin HEAD:gh-pages; else echo "gh-pages holds commits this branch does not; leaving the live site alone."; fi
